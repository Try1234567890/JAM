plugins {
    id 'java-library'
    id 'maven-publish'
}

version = '0.2.6'
var github_name = System.getenv('GITHUB_USERNAME')

repositories {
    mavenCentral()
    repositories {
        maven {
            name = 'Java-Libraries'
            url = uri('https://maven.pkg.github.com/' + github_name + '/Java-Libraries')
            credentials {
                username = github_name
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

dependencies {
    compileOnly('com.github.try:utilities:1.0.6')
    compileOnly('org.jetbrains:annotations:24.1.0')

    testImplementation(platform('org.junit:junit-bom:5.11.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}